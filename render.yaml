# TicketFlow Blueprint — https://render.com/docs/blueprint-spec
# Creates: Render Postgres + API (Docker) + frontend (Docker/nginx)

services:
  - type: web
    name: ticketflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /api/v1/health
    preDeployCommand: npm run migration:run:prod
    initialDeployHook: npm run db:seed:prod
    buildFilter:
      paths:
        - apps/backend/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ticketflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: APP_URL
        fromService:
          name: ticketflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          name: ticketflow-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: ticketflow-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/frontend/web-shell/Dockerfile
    dockerContext: ./apps/frontend/web-shell
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/frontend/web-shell/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_USE_MOCKS
        value: "false"
      # Build-time: Dockerfile sets VITE_API_BASE_URL=${API_ORIGIN}/api/v1
      - key: API_ORIGIN
        fromService:
          name: ticketflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: ticketflow-db
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: [] # private network only (API in the same region)
